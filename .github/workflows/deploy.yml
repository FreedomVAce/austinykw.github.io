name: Build & deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: node scripts/check-links.mjs
      # Optional: store the private denylist as the repository secret
      # PORTFOLIO_DENYLIST to also scan in CI. It is never printed.
      - name: Confidentiality scan
        env:
          DENYLIST: ${{ secrets.PORTFOLIO_DENYLIST }}
        run: |
          if [ -z "$DENYLIST" ]; then echo "PORTFOLIO_DENYLIST not set — skipping (the pre-push hook scans locally)"; exit 0; fi
          printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
          CONFIDENTIAL_DENYLIST="$RUNNER_TEMP/denylist.txt" node scripts/scan-confidential.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
